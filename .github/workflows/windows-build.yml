name: windows-build

# Windows/MSVC build, clippy, unit-test, Admin CLI smoke-test, and zip
# packaging gate for `beam-sys`, `beam-core`, `beam-tun`, `beam-client`, and
# the unelevated `beam-tray` Win32 client.

on:
  push:
    branches: [main]
    paths:
      - 'crates/beam-sys/**'
      - 'crates/beam-core/**'
      - 'crates/beam-tun/**'
      - 'crates/beam-client/**'
      - 'clients/windows-tray/**'
      - 'tests/windows-tray/**'
      - 'scripts/release-windows-tray.sh'
      - 'config.client.example.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'crates/beam-sys/**'
      - 'crates/beam-core/**'
      - 'crates/beam-tun/**'
      - 'crates/beam-client/**'
      - 'clients/windows-tray/**'
      - 'tests/windows-tray/**'
      - 'scripts/release-windows-tray.sh'
      - 'config.client.example.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test, smoke, and package (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Ensure nasm and cmake (aws-lc-sys)
        shell: pwsh
        run: |
          $nasmDir = 'C:\Program Files\NASM'
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if (Test-Path (Join-Path $nasmDir 'nasm.exe')) {
              Add-Content -Path $env:GITHUB_PATH -Value $nasmDir
            }
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake -y --no-progress
          }
          $env:PATH = "$nasmDir;C:\ProgramData\chocolatey\bin;$env:PATH"
          nasm --version
          cmake --version

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy (Windows MSVC)
        run: cargo clippy -p beam-sys -p beam-core -p beam-tun -p beam-client --all-targets -- -D warnings

      - name: Rust tests (Windows MSVC)
        run: cargo test -p beam-sys -p beam-core -p beam-tun -p beam-client -- -q

      - name: Rust release build (Windows MSVC release linking)
        run: cargo build --release -p beam-client

      - name: Build beam-tray.exe (rc + cl /W4 /WX)
        shell: cmd
        working-directory: clients\windows-tray
        run: |
          rc /nologo /fo app.res app.rc
          cl /nologo /std:c11 /W4 /WX /O2 /DUNICODE /D_UNICODE main.c app.res /Fe:beam-tray.exe /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib gdi32.lib

      - name: Tray logic unit tests (MSVC C11)
        shell: cmd
        run: |
          cl /nologo /std:c11 /W4 /WX /O2 /D_CRT_SECURE_NO_WARNINGS tests\windows-tray\test_tray_logic.c /Fe:test_tray_logic.exe || exit /b 1
          .\test_tray_logic.exe

      - name: Download and verify WinTun 0.14.1 (amd64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wintunZip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          $wintunDir = Join-Path $env:RUNNER_TEMP 'wintun-extract'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $wintunZip
          Expand-Archive -Path $wintunZip -DestinationPath $wintunDir -Force
          $dll = Join-Path $wintunDir 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $dll)) {
            throw "wintun.dll not found at $dll"
          }
          $expected = 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce'
          $actual = (Get-FileHash -Path $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "wintun.dll SHA-256 mismatch: got $actual, expected $expected"
          }
          Write-Host "Verified wintun.dll SHA-256: $actual"

      - name: Admin CLI smoke tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = '.\target\release\beam-client.exe'
          & $bin --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin --check -c config.client.example.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tmpCfg = Join-Path $env:RUNNER_TEMP 'smoke-client.toml'
          $vless = 'vless://00000000-0000-0000-0000-000000000000@203.0.113.10:443?encryption=none&flow=xtls-rprx-vision&security=reality&sni=whatsapp.net&pbk=WlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlo&sid=0123456789abcdef&type=tcp'
          $vless | & $bin --import-link -c $tmpCfg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin --check -c $tmpCfg
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $bin --cleanup-routes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package Windows client zip
        shell: bash
        env:
          BEAM_WINDOWS_CLIENT_BIN: target/release/beam-client.exe
          BEAM_WINDOWS_TRAY_BIN: clients/windows-tray/beam-tray.exe
          BEAM_WINDOWS_WINTUN_DLL: ${{ runner.temp }}/wintun-extract/wintun/bin/amd64/wintun.dll
          BEAM_RELEASE_OUT: ${{ runner.temp }}/windows-client-artifact
        run: |
          set -euo pipefail
          BEAM_RELEASE_COMMIT="$(git rev-parse --short=12 HEAD)"
          export BEAM_RELEASE_COMMIT
          bash scripts/release-windows-tray.sh | tee "$RUNNER_TEMP/windows-client-artifact/release-windows-tray.txt"

      - name: Upload Windows client artifact
        uses: actions/upload-artifact@v4
        with:
          name: beam-windows-client
          path: |
            ${{ runner.temp }}/windows-client-artifact/*.zip
            ${{ runner.temp }}/windows-client-artifact/*.zip.sha256
            ${{ runner.temp }}/windows-client-artifact/release-windows-tray.txt
          retention-days: 14
