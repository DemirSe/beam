name: windows-build

# Windows/MSVC build, clippy, and unit-test gate for `beam-sys`, `beam-core`,
# `beam-tun`, `beam-client`, and the unelevated `beam-tray` Win32 client. The
# release build step proves MSVC release linking, which the debug-only clippy
# and test steps do not cover.

on:
  push:
    branches: [main]
    paths:
      - 'crates/beam-sys/**'
      - 'crates/beam-core/**'
      - 'crates/beam-tun/**'
      - 'crates/beam-client/**'
      - 'clients/windows-tray/**'
      - 'tests/windows-tray/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'crates/beam-sys/**'
      - 'crates/beam-core/**'
      - 'crates/beam-tun/**'
      - 'crates/beam-client/**'
      - 'clients/windows-tray/**'
      - 'tests/windows-tray/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'clippy.toml'
      - '.github/workflows/windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Rust fmt, clippy, unit tests (Windows MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc

      - name: Ensure nasm and cmake (aws-lc-sys)
        shell: pwsh
        run: |
          $nasmDir = 'C:\Program Files\NASM'
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if (Test-Path (Join-Path $nasmDir 'nasm.exe')) {
              Add-Content -Path $env:GITHUB_PATH -Value $nasmDir
            }
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake -y --no-progress
          }
          $env:PATH = "$nasmDir;C:\ProgramData\chocolatey\bin;$env:PATH"
          nasm --version
          cmake --version

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy (Windows MSVC)
        run: cargo clippy -p beam-sys -p beam-core -p beam-tun -p beam-client --all-targets -- -D warnings

      - name: Rust tests (Windows MSVC)
        run: cargo test -p beam-sys -p beam-core -p beam-tun -p beam-client -- -q

      - name: Rust release build (Windows MSVC release linking)
        run: cargo build --release -p beam-client

  windows-tray:
    name: Windows tray (MSVC C11)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build beam-tray.exe (rc + cl /W4 /WX)
        shell: cmd
        working-directory: clients\windows-tray
        run: |
          rc /nologo /fo app.res app.rc
          cl /nologo /std:c11 /W4 /WX /O2 /DUNICODE /D_UNICODE main.c app.res /Fe:beam-tray.exe /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib gdi32.lib

      - name: Tray logic unit tests (MSVC C11)
        shell: cmd
        run: |
          cl /nologo /std:c11 /W4 /WX /O2 tests\windows-tray\test_tray_logic.c /Fe:test_tray_logic.exe
          .\test_tray_logic.exe
