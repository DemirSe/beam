name: interop

# Authenticated end-to-end path: socks5 -> pinned sing-box -> VLESS/REALITY ->
# beam, covering both datagram encodings.
on:
  push:
    branches: [dev, main]
  workflow_dispatch:

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        encoding: [xudp, packetaddr]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build beam
        run: cargo build --locked --release --bin beam
      - name: Install pinned sing-box
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sb.tar.gz \
            https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64-glibc.tar.gz
          echo "231e57c18378f780a08de832844a1ca9716e17a7bcf82964b350844d243c03ac  /tmp/sb.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sb.tar.gz -C /tmp
          install -m 0755 /tmp/sing-box-1.14.4-linux-amd64-glibc/sing-box /usr/local/bin/sing-box
      - name: HTTPS through the tunnel
        run: |
          set -o pipefail
          python3 tests/stress/vless_tls_in_tls.py target/release/beam /usr/local/bin/sing-box
      - name: IPv6 destinations
        run: |
          set -o pipefail
          python3 tests/stress/vless_ipv6.py target/release/beam /usr/local/bin/sing-box
      - name: Half-close semantics
        run: |
          set -o pipefail
          python3 tests/stress/vless_halfclose.py target/release/beam /usr/local/bin/sing-box
      - name: Vision descriptor budget
        if: matrix.encoding == 'xudp'
        run: |
          set -o pipefail
          python3 tests/stress/vless_client.py --beam target/release/beam \
            --sing-box /usr/local/bin/sing-box --selftest
      - name: Splice-clone fallback
        if: matrix.encoding == 'xudp'
        run: |
          set -o pipefail
          python3 tests/stress/vless_tls_in_tls.py target/release/beam \
            /usr/local/bin/sing-box --squeeze-clones
      - name: Campaign (${{ matrix.encoding }})
        run: |
          set -o pipefail
          python3 tests/stress/vless_interop.py --beam target/release/beam \
            --sing-box /usr/local/bin/sing-box --repo . --encoding ${{ matrix.encoding }}
