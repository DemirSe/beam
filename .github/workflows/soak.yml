name: soak

# Sustained mixed traffic with bounded descriptors, RSS, and threads. Run on
# demand before a release. The historical 65,500-connection stall was replay
# cache saturation (see ISSUES.md); keep this under about five minutes as a
# budget, not because of an undiagnosed fault.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Duration in seconds
        required: false
        default: "300"

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOAK_SECONDS: ${{ github.event.inputs.seconds || '300' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Build beam
        run: cargo build --locked --release --bin beam
      - name: Install pinned sing-box
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/sb.tar.gz https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-linux-amd64-glibc.tar.gz
          echo "231e57c18378f780a08de832844a1ca9716e17a7bcf82964b350844d243c03ac  /tmp/sb.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sb.tar.gz -C /tmp
          install -m 0755 /tmp/sing-box-1.14.4-linux-amd64-glibc/sing-box /usr/local/bin/sing-box
      - name: Soak
        run: |
          set -o pipefail
          python3 tests/stress/vless_soak.py target/release/beam /usr/local/bin/sing-box
