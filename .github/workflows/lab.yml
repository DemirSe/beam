name: lab

# Full-TUN and benchmark runs belong on a trusted, persistent machine, not on a
# shared GitHub-hosted runner. This workflow is manual-only and requires a
# self-hosted runner labelled `beam-lab`.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite"
        required: true
        default: tun
        type: choice
        options: [tun, bench, both]
      udp_mode:
        description: "sing-box packet encoding for the TUN suite"
        required: true
        default: xudp
        type: choice
        options: [xudp, packetaddr, legacy]
      mtu:
        description: "TUN MTU (production 1500; 1400 is the H3-loss fallback)"
        required: true
        default: "1500"
      rtt_ms:
        description: "Benchmark netem RTT in milliseconds"
        required: true
        default: "0"
      reps:
        description: "Benchmark repetitions"
        required: true
        default: "2"

permissions:
  contents: read

concurrency:
  group: lab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lab:
    runs-on: [self-hosted, linux, x64, beam-lab]
    timeout-minutes: 360
    env:
      SING_BOX: sing-box
      XRAY_BIN: xray
      TEST_CONFIG: ${{ vars.BEAM_TEST_CONFIG }}
      IPERF3: iperf3
    steps:
      - uses: actions/checkout@v4
      - name: Prepare lab
        run: |
          source scripts/dev-env.sh
          mkdir -p "$RUNNER_TEMP/beam-lab"
          command -v "$SING_BOX" >/dev/null || { echo "missing SING_BOX: $SING_BOX" >&2; exit 1; }
          test -n "$TEST_CONFIG" && test -f "$TEST_CONFIG" || { echo "missing TEST_CONFIG repository variable" >&2; exit 1; }
          command -v "$IPERF3" >/dev/null || { echo "missing IPERF3: $IPERF3" >&2; exit 1; }
          if [ -n "$XRAY_BIN" ]; then command -v "$XRAY_BIN" >/dev/null || { echo "missing XRAY_BIN: $XRAY_BIN" >&2; exit 1; }; fi
      - name: Full-TUN suite
        if: inputs.suite != 'bench'
        run: |
          source scripts/dev-env.sh
          SKIP_BUILD=0 \
            SING_BOX="$SING_BOX" \
            TUN_MTU="${{ inputs.mtu }}" \
            TUN_STACK=system \
            TUN_OUT="$RUNNER_TEMP/beam-lab/tun" \
            bash tests/tun/run.sh --udp-mode "${{ inputs.udp_mode }}"
      - name: Benchmark suite
        if: inputs.suite != 'tun'
        run: |
          source scripts/dev-env.sh
          SKIP_BUILD=0 \
            SING_BOX="$SING_BOX" \
            XRAY_BIN="$XRAY_BIN" \
            TEST_CONFIG="$TEST_CONFIG" \
            IPERF3="$IPERF3" \
            bash bench/run.sh --quick \
              --reps "${{ inputs.reps }}" \
              --rtt-ms "${{ inputs.rtt_ms }}" \
              --arms beam,stock \
              --out "$RUNNER_TEMP/beam-lab/bench"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/beam-lab
          retention-days: 3
          if-no-files-found: ignore
