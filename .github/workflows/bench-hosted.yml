name: bench-hosted

# Stock-vs-beam A/B on a single GitHub-hosted runner.
#
# Everything runs inside one job: the harness creates the client/server/target
# network namespaces, so no runner-to-runner or inbound connectivity is needed.
# The runner's unprivileged user namespaces are blocked (see runner-preflight),
# so the benchmark runs as host root inside a private mount+net namespace; the
# harness's tmpfs over /run therefore never touches the runner.
#
# Results are published as the latest commit of the `bench-results` branch
# (summary.md/json, raw JSON, logs) so they can be read without an artifact
# token; config/large.bin and generated keys are excluded.
#
# Binaries are pinned by version and by the release-asset digest from the
# GitHub API, checked after download.

on:
  workflow_dispatch:
    inputs:
      rtt_ms:
        description: "netem RTT in milliseconds (0 is a client-capped smoke cell)"
        required: true
        default: "50"
      reps:
        description: "repetitions per arm"
        required: true
        default: "2"
      duration:
        description: "seconds per iperf3 window"
        required: true
        default: "5"
  push:
    paths:
      - .github/workflows/bench-hosted.yml

permissions:
  contents: write

concurrency:
  group: bench-hosted
  cancel-in-progress: false

env:
  SING_BOX_VERSION: "1.14.3"
  SING_BOX_SHA256: "e2bdf179c15a3652955dc44867e33ca0965c9c9b91b34267dcc5a5d639a5feee"
  XRAY_VERSION: "26.3.27"
  XRAY_SHA256: "23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae"
  RTT_MS: ${{ inputs.rtt_ms || '50' }}
  REPS: ${{ inputs.reps || '2' }}
  DURATION: ${{ inputs.duration || '5' }}

jobs:
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.99.1

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tests/tun/h3-origin -> target
          cache-on-failure: true

      - name: Host facts
        run: |
          echo "image=${ImageOS:-?}/${ImageVersion:-?}"
          uname -r; nproc; free -m; df -h / /tmp | tail -2

      - name: Install iperf3 and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq iperf3 iproute2 iputils-ping unzip

      - name: Fetch pinned proxies
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          sing_url="https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/sing-box.tgz" "$sing_url"
          echo "${SING_BOX_SHA256}  $RUNNER_TEMP/sing-box.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sing-box.tgz" -C "$tools"
          install -m 0755 "$tools/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" "$tools/sing-box"
          xray_url="https://github.com/XTLS/Xray-core/releases/download/v${XRAY_VERSION}/Xray-linux-64.zip"
          curl -fsSL -o "$RUNNER_TEMP/xray.zip" "$xray_url"
          echo "${XRAY_SHA256}  $RUNNER_TEMP/xray.zip" | sha256sum -c -
          unzip -q -o "$RUNNER_TEMP/xray.zip" -d "$tools/xray"
          install -m 0755 "$tools/xray/xray" "$tools/xray-bin"
          "$tools/sing-box" version
          "$tools/xray-bin" version | head -2
          cd "$GITHUB_WORKSPACE" && git rev-parse HEAD

      - name: Build beam
        timeout-minutes: 15
        run: |
          source scripts/dev-env.sh
          rustc --version
          cargo build --locked --release -p beam
          ls -l target/release/beam

      - name: Benchmark (root, private namespaces)
        timeout-minutes: 7
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          out="$RUNNER_TEMP/bench-out"
          sudo -n env \
            BENCH_INNER=1 \
            BENCH_ROOT="$GITHUB_WORKSPACE" \
            BENCH_SELF="$GITHUB_WORKSPACE/bench/run.sh" \
            BENCH_CLIENT_CPUS=0,1 \
            BENCH_DRIVER_CPU=0 \
            BENCH_MAX_LOAD=100 \
            SING_BOX="$tools/sing-box" \
            XRAY_BIN="$tools/xray-bin" \
            IPERF3=/usr/bin/iperf3 \
            TEST_CONFIG="$GITHUB_WORKSPACE/config.example.toml" \
            H3_ORIGIN_BIN="$GITHUB_WORKSPACE/tests/tun/h3-origin/target/debug/h3-origin" \
            SKIP_BUILD=1 \
            bash "$GITHUB_WORKSPACE/bench/run.sh" \
              --quick --reps "$REPS" --duration "$DURATION" \
              --rtt-ms "$RTT_MS" --arms stock,beam --out "$out"
          sudo chown -R "$(id -u):$(id -g)" "$out"

      - name: Step summary
        if: always()
        run: |
          out="$RUNNER_TEMP/bench-out"
          if [ -f "$out/summary.md" ]; then
            cat "$out/summary.md" >> "$GITHUB_STEP_SUMMARY"
            python3 - "$out/summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          if not path.is_file():
              raise SystemExit(0)
          s = json.loads(path.read_text(encoding="utf-8"))
          print(f"valid={s['valid']} hard={s['hard_requirements_status']} noise={s['host_noise']}")
          for name, cmp in s["comparisons"].items():
              print(f"{name}: stock={cmp.get('stock') and round(cmp['stock']['median'], 2)} "
                    f"beam={cmp.get('beam') and round(cmp['beam']['median'], 2)} ratio={cmp.get('ratio')}")
          PY
          else
            echo "no summary.md produced" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish results branch
        if: always()
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/bench-out"
          stage="$RUNNER_TEMP/results"
          rm -rf "$stage"; mkdir -p "$stage/run"
          if [ -d "$out" ]; then
            cp -a "$out/summary.md" "$out/summary.json" "$out/meta.json" \
                  "$out/environment.txt" "$out/network.txt" "$stage/run/" 2>/dev/null || true
            cp -a "$out/raw" "$stage/run/raw" 2>/dev/null || true
            mkdir -p "$stage/run/logs"
            cp -a "$out"/logs/*.log "$stage/run/logs/" 2>/dev/null || true
          fi
          {
            echo "run_id=$GITHUB_RUN_ID"
            echo "commit=$GITHUB_SHA"
            echo "rtt_ms=$RTT_MS reps=$REPS duration=$DURATION"
            echo "image=${ImageOS:-?}/${ImageVersion:-?}"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$stage/run/README.txt"
          du -sh "$stage"
          cd "$stage"
          git init -q -b bench-results
          git config user.name "bench-hosted"
          git config user.email "bench-hosted@users.noreply.github.com"
          git add -A
          git commit -q -m "bench-results: run $GITHUB_RUN_ID"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bench-results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
