name: android-build

on:
  push:
    branches: [main, android-lab-ci]
  pull_request:
    paths:
      - 'crates/beam-android/**'
      - 'clients/android/**'
      - 'scripts/android-*.sh'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

env:
  NDK_VERSION: 27.2.12479018

jobs:
  build-and-test:
    name: Rust + Gradle build, unit tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (beam-sys, beam-android)
        run: cargo test -p beam-sys -p beam-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK r27c + SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"

      - name: Build libbeam_android.so (aarch64, NDK r27c)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android31-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --release -p beam-android --target aarch64-linux-android
          "$TOOLCHAIN/bin/llvm-strip" target/aarch64-linux-android/release/libbeam_android.so
          mkdir -p clients/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libbeam_android.so \
             clients/android/app/src/main/jniLibs/arm64-v8a/

      - name: Gradle unit tests + lint + release APK
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          cd clients/android
          ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: beam-android-apk
          path: clients/android/app/build/outputs/apk/release/*.apk

  emulator-lab:
    name: Emulator smoke test (x86_64 KVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM and verify /dev/kvm
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -c /dev/kvm
          test -r /dev/kvm -a -w /dev/kvm
          ls -l /dev/kvm

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-linux-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install NDK r27c + SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"

      - name: Build libbeam_android.so (x86_64, NDK r27c)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_x86_64_linux_android="$TOOLCHAIN/bin/x86_64-linux-android31-clang"
          export AR_x86_64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$CC_x86_64_linux_android"
          cargo build --release -p beam-android --target x86_64-linux-android
          mkdir -p clients/android/app/src/main/jniLibs/x86_64
          cp target/x86_64-linux-android/release/libbeam_android.so \
             clients/android/app/src/main/jniLibs/x86_64/

      - name: Compile debug and instrumentation APKs
        run: |
          cd clients/android
          ./gradlew -Pbeam.includeX86_64=true assembleDebug assembleDebugAndroidTest

      - name: Boot emulator, run instrumentation tests, launch app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: >-
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            cd clients/android
            ./gradlew -Pbeam.includeX86_64=true connectedDebugAndroidTest
            adb shell am start -W -n com.beam.android/.ui.MainActivity
            sleep 10
            pid="$(adb shell pidof com.beam.android | tr -d '\r')"
            if [ -z "$pid" ]; then
              echo "error: com.beam.android died after launch"
              adb logcat -d -t 200
              exit 1
            fi
            echo "com.beam.android pid=$pid still alive after launch"
            adb shell dumpsys meminfo com.beam.android | head -n 25
