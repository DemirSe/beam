name: android-build

on:
  push:
    paths:
      - 'crates/beam-android/**'
      - 'clients/android/**'
      - 'scripts/android-*.sh'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'crates/beam-android/**'
      - 'clients/android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target
        run: rustup target add aarch64-linux-android

      - name: Rust fmt + clippy
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (beam-android)
        run: cargo test -p beam-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"

      - name: Build libbeam_android.so
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android31-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          cargo build --release -p beam-android --target aarch64-linux-android
          "$TOOLCHAIN/bin/llvm-strip" target/aarch64-linux-android/release/libbeam_android.so
          mkdir -p clients/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libbeam_android.so \
             clients/android/app/src/main/jniLibs/arm64-v8a/

      - name: Gradle unit tests + lint + release
        run: |
          test -d "$ANDROID_HOME"
          cd clients/android
          ./gradlew testDebugUnitTest lintDebug assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beam-android-apk
          path: clients/android/app/build/outputs/apk/release/*.apk
