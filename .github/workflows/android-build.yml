name: android-build

on:
  push:
    branches: [main]
    paths:
      - 'crates/beam-android/**'
      - 'crates/beam-sys/**'
      - 'crates/beam-core/**'
      - 'crates/beam-tun/**'
      - 'crates/beam-client/**'
      - 'Cargo.lock'
      - 'clients/android/**'
      - 'scripts/android-*.sh'
      - '.github/workflows/android-build.yml'
  pull_request:
    paths:
      - 'crates/beam-android/**'
      - 'crates/beam-sys/**'
      - 'crates/beam-core/**'
      - 'crates/beam-tun/**'
      - 'crates/beam-client/**'
      - 'Cargo.lock'
      - 'clients/android/**'
      - 'scripts/android-*.sh'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

env:
  NDK_VERSION: 27.2.12479018

jobs:
  build-and-test:
    name: Rust + Gradle build, unit tests, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Rust fmt
        run: cargo fmt --all -- --check

      - name: Rust clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests (beam-sys, beam-android)
        run: cargo test -p beam-sys -p beam-android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache NDK r27c
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: android-ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: Install NDK r27c + SDK 35
        run: |
          if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          else
            sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          fi

      - name: Restore persistent CI debug keystore (if configured)
        env:
          BEAM_DEBUG_KEYSTORE_B64: ${{ secrets.BEAM_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$BEAM_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$BEAM_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - name: Restore release keystore (if configured)
        env:
          BEAM_RELEASE_KEYSTORE_B64: ${{ secrets.BEAM_RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$BEAM_RELEASE_KEYSTORE_B64" ]; then
            printf '%s' "$BEAM_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "BEAM_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build libbeam_android.so (aarch64, NDK r27c)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_aarch64_linux_android="$TOOLCHAIN/bin/aarch64-linux-android31-clang"
          export AR_aarch64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC_aarch64_linux_android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --release -p beam-android --target aarch64-linux-android
          "$TOOLCHAIN/bin/llvm-strip" target/aarch64-linux-android/release/libbeam_android.so
          "$TOOLCHAIN/bin/llvm-readelf" -l target/aarch64-linux-android/release/libbeam_android.so | grep -q '0x4000'
          mkdir -p clients/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/libbeam_android.so \
             clients/android/app/src/main/jniLibs/arm64-v8a/

      - name: Gradle unit tests + lint + APKs
        env:
          BEAM_KEYSTORE_PASSWORD: ${{ secrets.BEAM_KEYSTORE_PASSWORD }}
          BEAM_KEY_ALIAS: ${{ secrets.BEAM_KEY_ALIAS }}
          BEAM_KEY_PASSWORD: ${{ secrets.BEAM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME"
          cd clients/android
          SIGN_FLAG=""
          if [ -z "${BEAM_KEYSTORE_PATH:-}" ]; then
            SIGN_FLAG="-Pbeam.signReleaseWithDebug=true"
          fi
          ./gradlew \
            -Pbeam.versionCode="${{ github.run_number }}" \
            $SIGN_FLAG \
            testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk
          MAPPING="app/build/outputs/mapping/release/mapping.txt"
          test -f "$MAPPING"
          # Verify R8 kept all JNI and cross-process AIDL contracts intact.
          grep -q 'com\.beam\.android\.vpn\.BeamNativeBridge -> com\.beam\.android\.vpn\.BeamNativeBridge:' "$MAPPING"
          grep -q 'com\.beam\.android\.vpn\.NativeStateListener -> com\.beam\.android\.vpn\.NativeStateListener:' "$MAPPING"
          grep -q 'onNativeStateChanged(int,java\.lang\.String).* -> onNativeStateChanged' "$MAPPING"
          grep -q 'com\.beam\.android\.ipc\.IBeamVpnService -> com\.beam\.android\.ipc\.IBeamVpnService:' "$MAPPING"

      - name: Upload debug APK (installable on device)
        uses: actions/upload-artifact@v4
        with:
          name: beam-android-debug-apk
          path: clients/android/app/build/outputs/apk/debug/*.apk

      - name: Upload release APK (R8 minified)
        uses: actions/upload-artifact@v4
        with:
          name: beam-android-apk
          path: clients/android/app/build/outputs/apk/release/*.apk

      - name: Upload R8 release mapping
        uses: actions/upload-artifact@v4
        with:
          name: beam-android-release-mapping
          path: clients/android/app/build/outputs/mapping/release/mapping.txt

  emulator-lab:
    name: Emulator smoke test (x86_64 KVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM and verify /dev/kvm
        run: |
          set -uo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || echo "warn: udevadm reload failed"
          sudo udevadm trigger --name-match=kvm || echo "warn: udevadm trigger failed"
          sudo chmod 666 /dev/kvm 2>/dev/null || true
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM_AVAILABLE=1" >> "$GITHUB_ENV"
            ls -l /dev/kvm
          else
            echo "KVM_AVAILABLE=0" >> "$GITHUB_ENV"
            echo "::warning::/dev/kvm is unavailable; the emulator will use software emulation"
            ls -ld /dev/kvm /sys/class/misc/kvm 2>&1 || true
            grep -c -E 'vmx|svm' /proc/cpuinfo || true
          fi

      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-x86_64

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Cache NDK r27c
        id: ndk-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          key: android-ndk-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: Install NDK r27c + SDK 35
        run: |
          if [ -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            sdkmanager "platforms;android-35" "build-tools;35.0.0"
          else
            sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;$NDK_VERSION"
          fi

      - name: Restore persistent CI debug keystore (if configured)
        env:
          BEAM_DEBUG_KEYSTORE_B64: ${{ secrets.BEAM_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$BEAM_DEBUG_KEYSTORE_B64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$BEAM_DEBUG_KEYSTORE_B64" | base64 -d > "$HOME/.android/debug.keystore"
          fi

      - name: Build libbeam_android.so (x86_64, NDK r27c)
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          set -euo pipefail
          TOOLCHAIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          export CC_x86_64_linux_android="$TOOLCHAIN/bin/x86_64-linux-android31-clang"
          export AR_x86_64_linux_android="$TOOLCHAIN/bin/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$CC_x86_64_linux_android"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          cargo build --release -p beam-android --target x86_64-linux-android
          mkdir -p clients/android/app/src/main/jniLibs/x86_64
          cp target/x86_64-linux-android/release/libbeam_android.so \
             clients/android/app/src/main/jniLibs/x86_64/

      - name: Compile debug, instrumentation, and R8 release APKs
        run: |
          cd clients/android
          ./gradlew -Pbeam.includeX86_64=true -Pbeam.signReleaseWithDebug=true \
            assembleDebug assembleDebugAndroidTest assembleRelease

      - name: Boot emulator, run instrumentation tests, and smoke-test R8 release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          emulator-boot-timeout: 1800
          emulator-options: >-
            ${{ env.KVM_AVAILABLE == '0' && '-accel off' || '' }}
            -no-snapshot-save -no-window -gpu swiftshader_indirect
            -noaudio -no-boot-anim
          script: bash scripts/android-emulator-smoke.sh

      - name: Upload emulator test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: clients/android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
