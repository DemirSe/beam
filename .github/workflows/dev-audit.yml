name: dev-audit

# Every push is verified: formatting, lints, the full workspace suite, and the
# rootless script suites from `make test-scripts`.
on:
  push:
  workflow_dispatch:

concurrency:
  group: dev-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BEAM_REQUIRE_IPV6_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | grep -E 'Running|Doc-tests|test result|^failures:|^    [a-z_0-9:]+$'
      - name: Test (release)
        run: |
          set -o pipefail
          cargo test --workspace --release 2>&1 | grep -E 'Running|Doc-tests|test result|^failures:|^    [a-z_0-9:]+$'
      - name: Script contract tests
        run: make test-scripts
