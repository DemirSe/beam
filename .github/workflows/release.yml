name: release

# Permanent release for one `prod` commit or a `v*` tag.
#
# `prod` is the single permanent release line: it points only at the commit the
# production host runs. `main` is the development line and is never a release
# source; this workflow refuses it. A push to `prod`, or a push of a `v*` tag,
# verifies the tree, builds the archives, and stops there. A tag names any
# commit, so the build also requires the checked-out commit to be the tip of
# `prod`. Publishing needs a manual dispatch with `publish` set on
# `refs/heads/prod`, so no release appears without the owner's approval. The tag
# this workflow creates comes from its own token, and GitHub does not start
# workflows from that token, so a published release cannot trigger this
# workflow again.
#
# The GitHub Release is the permanent download: the Linux server archive and the
# native Windows client zip (plus their SHA-256 pins) are attached as release
# assets and kept. A short-lived internal Actions artifact passes the Windows
# build from `build-windows` to `release`.
#
# Publishing creates a draft, downloads its own assets, checks them against the
# pin, and only then makes the release public.
#
# This gate is `make verify`, which already runs the artifact contract tests
# through `make test-scripts`. The hosted lab is dispatch-only and separate, so
# a green release run does not prove lab coverage.
on:
  push:
    branches: [prod]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release from this run (prod only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BEAM_REQUIRE_IPV6_TESTS: "1"

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Require the prod branch or a v* tag
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/prod|refs/tags/v*) ;;
            refs/heads/main)
              echo "release: main is the development line, not the deployed commit; use prod" >&2
              exit 1 ;;
            *)
              echo "release: build from prod or a v* tag, not $GITHUB_REF" >&2
              exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the prod tip
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          die() { echo "release: $*" >&2; exit 1; }
          head="$(git rev-parse HEAD)"
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" \
            --jq .object.sha 2>/dev/null)" ||
            die "cannot read the prod branch; build only from prod"
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]] || die "bad prod tip '$tip'"
          [ "$head" = "$tip" ] ||
            die "$GITHUB_REF is at $head; prod is at $tip"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-msvc-release
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Ensure nasm and cmake (aws-lc-sys)
        shell: pwsh
        run: |
          $nasmDir = 'C:\Program Files\NASM'
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
            if (Test-Path (Join-Path $nasmDir 'nasm.exe')) {
              Add-Content -Path $env:GITHUB_PATH -Value $nasmDir
            }
          }
          if (-not (Get-Command cmake -ErrorAction SilentlyContinue)) {
            choco install cmake -y --no-progress
          }
          $env:PATH = "$nasmDir;C:\ProgramData\chocolatey\bin;$env:PATH"
          nasm --version
          cmake --version
      - name: Build beam-client.exe (release)
        run: cargo build --release -p beam-client
      - name: Build beam-tray.exe (MSVC)
        shell: cmd
        working-directory: clients\windows-tray
        run: |
          rc /nologo /fo app.res app.rc
          cl /nologo /std:c11 /W4 /WX /O2 /DUNICODE /D_UNICODE main.c app.res /Fe:beam-tray.exe /link /SUBSYSTEM:WINDOWS user32.lib shell32.lib gdi32.lib
      - name: Download and verify WinTun 0.14.1 (amd64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wintunZip = Join-Path $env:RUNNER_TEMP 'wintun-0.14.1.zip'
          $wintunDir = Join-Path $env:RUNNER_TEMP 'wintun-extract'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $wintunZip
          Expand-Archive -Path $wintunZip -DestinationPath $wintunDir -Force
          $dll = Join-Path $wintunDir 'wintun\bin\amd64\wintun.dll'
          if (-not (Test-Path $dll)) {
            throw "wintun.dll not found at $dll"
          }
          $expected = 'e5da8447dc2c320edc0fc52fa01885c103de8c118481f683643cacc3220dafce'
          $actual = (Get-FileHash -Path $dll -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "wintun.dll SHA-256 mismatch: got $actual, expected $expected"
          }
      - name: Package Windows client
        shell: bash
        env:
          BEAM_WINDOWS_CLIENT_BIN: target/release/beam-client.exe
          BEAM_WINDOWS_TRAY_BIN: clients/windows-tray/beam-tray.exe
          BEAM_WINDOWS_WINTUN_DLL: ${{ runner.temp }}/wintun-extract/wintun/bin/amd64/wintun.dll
          BEAM_RELEASE_OUT: ${{ runner.temp }}/release-windows-artifact
        run: |
          set -euo pipefail
          BEAM_RELEASE_COMMIT="$(git rev-parse --short=12 HEAD)"
          export BEAM_RELEASE_COMMIT
          bash scripts/release-windows-tray.sh | tee "$RUNNER_TEMP/release-windows-artifact/release-windows-tray.txt"
      - name: Upload Windows release artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-windows-artifact
          path: |
            ${{ runner.temp }}/release-windows-artifact/*.zip
            ${{ runner.temp }}/release-windows-artifact/*.zip.sha256
            ${{ runner.temp }}/release-windows-artifact/release-windows-tray.txt
          retention-days: 1

  release:
    needs: [build-windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The publish step creates the release; the checkout keeps no credentials.
    permissions:
      contents: write
    steps:
      - name: Require the prod branch or a v* tag
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/prod|refs/tags/v*) ;;
            refs/heads/main)
              echo "release: main is the development line, not the deployed commit; use prod" >&2
              exit 1 ;;
            *)
              echo "release: build from prod or a v* tag, not $GITHUB_REF" >&2
              exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require the prod tip
        # A `v*` tag, or a dispatch on a tag ref, names any commit. Only the
        # commit `prod` points at is the deployed source.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          die() { echo "release: $*" >&2; exit 1; }
          head="$(git rev-parse HEAD)"
          tip="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/prod" \
            --jq .object.sha 2>/dev/null)" ||
            die "cannot read the prod branch; build only from prod"
          [[ "$tip" =~ ^[0-9a-f]{40}$ ]] || die "bad prod tip '$tip'"
          [ "$head" = "$tip" ] ||
            die "$GITHUB_REF is at $head; prod is at $tip"
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Verify
        run: make verify
      - name: Download Windows release artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows-artifact
          path: ${{ runner.temp }}/release-windows-artifact
      - name: Build and package
        # Outside target/: a restored build cache must not make a rerun refuse
        # to replace a stale archive.
        env:
          BEAM_RELEASE_OUT: ${{ runner.temp }}/release-artifact
        run: |
          set -euo pipefail
          bash scripts/release-artifact.sh | tee "$RUNNER_TEMP/release-artifact.txt"
          cp "$RUNNER_TEMP/release-windows-artifact/release-windows-tray.txt" "$RUNNER_TEMP/release-windows-tray.txt"
      - name: Record the artifact
        run: |
          set -euo pipefail
          {
            echo '### beam release artifact'
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/release-artifact.txt"
            cat "$RUNNER_TEMP/release-windows-tray.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          die() { echo "release: $*" >&2; exit 1; }
          # A tag or a dispatch elsewhere names a commit, not the deployed
          # source. Publish only from the prod branch.
          [ "$GITHUB_REF" = "refs/heads/prod" ] ||
            die "publish only from refs/heads/prod, not '$GITHUB_REF'"
          report="$RUNNER_TEMP/release-artifact.txt"
          [ -f "$report" ] || die "no artifact report; the build step did not run"
          field() { sed -n "s/^$1=//p" "$report" | tail -n 1; }
          version="$(field version)"
          commit="$(field commit)"
          target="$(field target)"
          artifact="$(field artifact)"
          archive_sha="$(field artifact_sha256)"
          # These values become a tag, asset names, and a path. Accept only the
          # shape scripts/release-artifact.sh emits, and only after checking the
          # file against its own pin.
          [[ "$version" =~ ^[0-9A-Za-z][0-9A-Za-z.+_-]*$ ]] ||
            die "bad version '$version'"
          [[ "$commit" =~ ^[0-9a-f]{7,40}$ ]] || die "bad commit '$commit'"
          [[ "$target" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] ||
            die "bad target '$target'"
          [ -f "$artifact" ] && [ ! -L "$artifact" ] ||
            die "artifact not found: '$artifact'"
          archive="$(basename "$artifact")"
          [ "$archive" = "beam-$version-$commit-$target.tar.gz" ] ||
            die "artifact '$archive' is not beam-$version-$commit-$target.tar.gz"
          [ "$archive_sha" = "$(sha256sum "$artifact" | cut -d' ' -f1)" ] ||
            die "$archive does not match the reported SHA-256"
          case "$GITHUB_SHA" in
            "$commit"*) ;;
            *) die "report commit $commit is not the checked-out $GITHUB_SHA" ;;
          esac
          pin="$artifact.sha256"
          [ -f "$pin" ] || die "no checksum pin next to $archive"
          win_report="$RUNNER_TEMP/release-windows-tray.txt"
          [ -f "$win_report" ] || die "no windows tray report; the build step did not run"
          win_field() { sed -n "s/^$1=//p" "$win_report" | tail -n 1; }
          win_version="$(win_field win_version)"
          win_commit="$(win_field win_commit)"
          win_target="$(win_field win_target)"
          win_artifact="$(win_field win_artifact)"
          win_archive_sha="$(win_field win_artifact_sha256)"
          [ "$win_version" = "$version" ] ||
            die "windows client version '$win_version' does not match '$version'"
          [ "$win_commit" = "$commit" ] ||
            die "windows client commit '$win_commit' does not match '$commit'"
          [[ "$win_target" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]*$ ]] ||
            die "bad windows target '$win_target'"
          win_archive="${win_artifact##*[/\\]}"
          if [ ! -f "$win_artifact" ] && [ -f "$RUNNER_TEMP/release-windows-artifact/$win_archive" ]; then
            win_artifact="$RUNNER_TEMP/release-windows-artifact/$win_archive"
          fi
          [ -f "$win_artifact" ] && [ ! -L "$win_artifact" ] ||
            die "windows artifact not found: '$win_artifact'"
          [ "$win_archive" = "beam-windows-client-$version-$commit-$win_target.zip" ] ||
            die "windows artifact '$win_archive' is not beam-windows-client-$version-$commit-$win_target.zip"
          [ "$win_archive_sha" = "$(sha256sum "$win_artifact" | cut -d' ' -f1)" ] ||
            die "$win_archive does not match the reported SHA-256"
          win_pin="$win_artifact.sha256"
          [ -f "$win_pin" ] || die "no checksum pin next to $win_archive"
          tag="v$version-$commit"
          # A release or tag is never replaced. A failed run leaves a draft, so
          # the owner removes it before a retry.
          ! gh release view "$tag" >/dev/null 2>&1 ||
            die "release $tag already exists"
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1 ||
            die "tag $tag already exists"
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "beam \`$version\` from \`$commit\` for \`$target\`."
            echo
            echo 'The server archive holds `beam`, `beam.service`, `beam-install.sh`,'
            echo '`config.example.toml`, `liveness-check.py`, `beam-liveness.service`,'
            echo '`beam-liveness.timer`, and `SHA256SUMS`.'
            echo
            echo '```'
            sed "s|^artifact=.*|artifact=$archive|" "$report"
            sed "s|^win_artifact=.*|win_artifact=$win_archive|" "$win_report"
            echo '```'
            echo
            echo '## Install (Linux server)'
            echo
            echo 'Download the archive and its `.sha256` pin into one directory, then:'
            echo
            echo '```sh'
            echo "sha256sum -c $archive.sha256"
            echo "tar -xzf $archive"
            echo '# Replace the sample key, user id, server name, and dest.'
            echo 'chmod 600 config.example.toml'
            echo "sudo env BEAM_ARTIFACT=$archive BEAM_CONFIG=config.example.toml \\"
            echo '  bash beam-install.sh install'
            echo '```'
            echo
            echo '## Native Windows client'
            echo
            echo "Download \`$win_archive\` and \`$win_archive.sha256\`, extract the zip"
            echo '(includes `beam-client.exe`, `beam-tray.exe`, `wintun.dll`,'
            echo '`config.client.example.toml`, and `install.cmd`), then double-click'
            echo '`install.cmd` and import your `vless://` link from the tray menu.'
          } > "$notes"
          # Draft first: the release becomes public only after the downloaded
          # bytes match both pins.
          gh release create "$tag" --draft --target "$GITHUB_SHA" \
            --title "beam $version ($commit)" --notes-file "$notes" \
            "$artifact" "$pin" "$win_artifact" "$win_pin"
          download="$RUNNER_TEMP/release-download"
          mkdir -p "$download"
          verify_download() {
            gh release download "$tag" --dir "$download" || return 1
            cmp -s "$pin" "$download/$(basename "$pin")" || return 1
            cmp -s "$win_pin" "$download/$(basename "$win_pin")" || return 1
            [ "$(sha256sum "$download/$archive" | cut -d' ' -f1)" = "$archive_sha" ] || return 1
            [ "$(sha256sum "$download/$win_archive" | cut -d' ' -f1)" = "$win_archive_sha" ] || return 1
            ( cd "$download" && sha256sum -c "$(basename "$pin")" && sha256sum -c "$(basename "$win_pin")" )
          }
          if ! verify_download; then
            gh release delete "$tag" --yes >/dev/null 2>&1 ||
              echo "release: delete the draft $tag by hand" >&2
            die "downloaded asset does not match $archive or $win_archive"
          fi
          gh release edit "$tag" --draft=false
          {
            echo ''
            echo "Published $(gh release view "$tag" --json url --jq .url)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Note the publish gate
        if: github.event_name != 'workflow_dispatch' || inputs.publish != true
        run: |
          {
            echo ''
            echo 'No release published: dispatch this workflow with `publish` set.'
          } >> "$GITHUB_STEP_SUMMARY"
