# Bound conntrack for scanner and churn load on a 1 GiB host.
#
# The Debian default of 8192 entries with a five-day established timeout is
# smaller than a 10k-connection churn can produce. nftables evaluates
# `ct state` before accepting 443, so a full table makes the VPN look down even
# when beam is healthy. These values keep the table bounded well below the
# memory limit while giving normal browsing plenty of headroom.
net.netfilter.nf_conntrack_max = 65536
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
# XUDP retains sessions for 60 s and legacy UDP for 300 s. The Debian default
# 30 s unidirectional UDP timeout can evict the conntrack entry before a late
# target reply, after which nftables' `ct state invalid drop` discards it.
# Keep a 2x margin over the longest relay idle period.
net.netfilter.nf_conntrack_udp_timeout = 600
net.netfilter.nf_conntrack_udp_timeout_stream = 600
