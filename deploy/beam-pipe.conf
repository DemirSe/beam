# Optional: opt in to 1 MiB Vision Direct pipes.
#
# Install this drop-in only together with deploy/99-beam-pipe.conf (or an
# equivalent fs.pipe-user-pages-soft=65536 setting). The default 512 KiB pipe
# avoids the per-user pipe-page soft limit at high concurrency.
[Service]
Environment=BEAM_PIPE_SIZE=1048576
