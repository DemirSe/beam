# Optional: allow beam to select 1 MiB Vision Direct pipes.
#
# Use this only together with deploy/beam-pipe.conf, which sets
# BEAM_PIPE_SIZE=1048576. At the Debian default (16384 pages = 64 MiB) beam
# keeps the conservative 512 KiB pipe and has no concurrency regression.
# 65536 pages = 256 MiB fits the 120-direction splice budget
# (2 x 1 MiB x 120 = 240 MiB) and enables the measured single-flow TLS Direct
# gain. Install this file and restart beam only if that trade-off suits the host.
fs.pipe-user-pages-soft = 65536
