# Install as /etc/ssh/sshd_config.d/00-beam-hardening.conf on RHEL and
# AlmaLinux, or as 60-hardening.conf on Debian, which ships no vendor drop-ins.
# Verify with `sshd -t` and keep a provider console available before reloading.
#
# Replace `beam` below with the account that must log in. A name that does
# not exist on the host locks out every other account.
#
# On RHEL and AlmaLinux the installer ships 01-permitrootlogin.conf and
# 50-redhat.conf. sshd uses the first value it reads, so install this file as
# 00-beam-hardening.conf there; otherwise PermitRootLogin and X11Forwarding
# keep the vendor value.
AllowUsers beam
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
X11Forwarding no
MaxAuthTries 3
LoginGraceTime 30
