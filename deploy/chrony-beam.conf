# Beam host time sources.
#
# Five explicit servers from four institutions in three countries. There is no
# pool entry, so the operator set is fixed and auditable and never rotates to
# an unknown host. The host clock matters for one reason only: REALITY rejects
# a handshake whose timestamp is more than 300 seconds away from the server
# clock.
#
# None of these operators smears leap seconds. The known smearing services are
# Google time, Amazon Time Sync, and Meta time. They are left out on purpose,
# because a smear disagrees with UTC by up to one second and would split the
# source set at a leap second.
#
# time.cloudflare.com is also left out. Measured from this host, that anycast
# address answers about 16 ms away from every other source, six samples in a
# row. The others agree within about 3 ms.

server time.ume.tubitak.gov.tr iburst
server ntp.ulakbim.gov.tr iburst
server ntp.ripe.net iburst
server ptbtime1.ptb.de iburst
server ntp.time.nl iburst

# Require three sources to agree before chrony corrects the clock. One bad or
# compromised source cannot move the host clock on its own.
minsources 3

# Prefer a low stratum over a merely close server. A stratum 1 or 2 national
# source is a better reference than a close commodity server.
stratumweight 0.05

# Keep the clock from jumping after boot. Step at start, then slew.
makestep 1.0 3
rtcsync
driftfile /var/lib/chrony/chrony.drift
logdir /var/log/chrony
maxupdateskew 100.0

# Act as a client only. Port 0 disables the NTP server socket. The control
# socket stays on IPv4 loopback so that the host keeps zero IPv6 listeners.
port 0
bindcmdaddress 127.0.0.1
