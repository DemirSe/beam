# beam network tuning.
#
# XUDP session sockets request the configured 128 KiB SO_RCVBUF. Linux clamps
# that request to net.core.rmem_max and then doubles the stored value; 4 MiB
# leaves headroom for large HTTP/3 bursts without allowing an unbounded socket
# buffer. BBR + fq are part of the measured production path and must be shipped
# with a rebuild, not left as host-local drift.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
