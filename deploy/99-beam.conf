# beam UDP receive headroom.
#
# XUDP session sockets request a 1 MiB SO_RCVBUF. Linux clamps that request to
# net.core.rmem_max and then doubles the stored value. The default Debian limit
# is 208 KiB, which is too small for a multi-megabyte HTTP/3 body arriving while
# the outer TLS stream drains. Keep the request bounded and let the kernel cap
# it here.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
