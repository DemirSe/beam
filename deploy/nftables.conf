#!/usr/sbin/nft -f
# beam host firewall. Apply with `nft -c -f` first, then enable nftables.
#
# The counters exist for diagnosis: `nft list table inet filter` shows how many
# bytes each rule handles, and the last rule shows what the host drops. A
# counter adds a per-CPU increment per matching packet. On this host that cost
# did not change measured throughput (245 Mbit/s without counters and 271
# Mbit/s with counters, three runs each, same path).
#
# `established,related` counts the whole session, so the port rules count only
# new connections. That is why rule 4 can show a large byte count while the
# port 443 rule shows a few packets.
flush ruleset
table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;
    iifname "lo" accept
    ct state established,related counter accept
    ct state invalid counter drop
    ip protocol icmp accept
    ip6 nexthdr ipv6-icmp accept
    # Keep this port in sync with `Port` in deploy/sshd-62-port.conf and with
    # SSH_PORT. A mismatch locks you out as soon as nftables starts.
    tcp dport 22 counter accept
    tcp dport 443 counter accept
    udp dport 5355 counter drop
    counter drop
  }
  chain forward {
    type filter hook forward priority filter; policy drop;
  }
  chain output {
    type filter hook output priority filter; policy accept;
  }
}
