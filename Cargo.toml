[workspace]
resolver = "3"
members = ["crates/beam", "crates/beam-android", "crates/beam-client", "crates/beam-core", "crates/beam-sys", "crates/beam-tun"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
beam-core = { path = "crates/beam-core" }
beam-sys = { path = "crates/beam-sys" }
beam-tun = { path = "crates/beam-tun" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
