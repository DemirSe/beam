# Example configuration for beam-client (placeholder values only).
# Replace every value with your server's real identity before running.

[server]
address = "203.0.113.10:443"
sni = "whatsapp.net"
public_key = "WlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlpaWlo"
short_id = "0123456789abcdef"
user_id = "00000000-0000-0000-0000-000000000000"

[tun]
name = "beamtun0"
address = "172.19.0.1/30"
mtu = 1500
auto_route = true
reject_quic = true
# Set reject_ipv6 = true (with dns.ipv4_only = true) when the upstream server
# has IPv4-only egress so IPv6 fails fast while split routes prevent leaks.
reject_ipv6 = false

[dns]
enabled = true
# Supports DoH ("https://1.1.1.1/dns-query" or "https://dns.nextdns.io/<id>"),
# plain TCP ("tcp://1.1.1.1:53"), or plain UDP ("1.1.1.1:53").
upstream = "https://1.1.1.1/dns-query"
# Omit local_upstream to auto-detect the host's pre-VPN local DNS.
# local_upstream = "192.168.1.1:53"
local_suffixes = ["lan", "local", "internal"]
cache_size = 1024
query_timeout_ms = 4000
ipv4_only = false

[bypass]
# Extra IPv4/IPv6 CIDRs or domain suffixes kept outside the tunnel.
cidrs = []
domains = []

[limits]
max_tcp_connections = 256
max_udp_sessions = 256
handshake_timeout_ms = 10000
idle_timeout_ms = 300000

[log]
level = "info"
