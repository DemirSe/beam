[package]
name = "beam-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
base64 = "0.22"
bytes = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
subtle = "2"
thiserror = "2"
toml = "0.9"
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
