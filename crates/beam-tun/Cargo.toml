[package]
name = "beam-tun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
beam-core = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
rustls-pki-types = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
tracing = "0.1"
webpki-roots = "1"

[dev-dependencies]
smoltcp = { version = "0.12", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "socket-tcp", "alloc"] }
tokio = { version = "1", features = ["rt-multi-thread", "test-util"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
