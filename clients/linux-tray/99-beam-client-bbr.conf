# beam Linux client TCP tuning.
#
# BBR is sender-side: it improves TCP uploads on lossy/high-RTT paths, while
# downloads are governed by the remote server's congestion control. fq is the
# preferred pacing qdisc for BBR; without it the kernel falls back to internal
# per-socket pacing. Keep buffer and latency sysctls out of this file: the lab
# showed 16 MiB buffers only help when both endpoints are tuned, and
# tcp_notsent_lowat trades throughput for interactive latency.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
